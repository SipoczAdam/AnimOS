insmod all_video
insmod png
insmod font
insmod gfxterm
insmod gettext

set gfxmode=1024x768
set gfxpayload=keep

set theme=/boot/grub/themes/grub-theme/theme.txt

terminal_output gfxterm

set timeout=15
set default=0

menuentry "AnimOS Experience v1.0 By Adam" {
    multiboot2 /boot/kernel.bin
    boot
}